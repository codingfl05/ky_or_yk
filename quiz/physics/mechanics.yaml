    - $\alpha$ (각가속도)
    - $\tau$ (돌림힘)
    - $\omega$ (각속도)
  answer: 0
  explain: $F = ma$ ↔ $\tau = I\alpha$. 질량 ↔ 관성모멘트, 힘 ↔ 돌림힘, 가속도 ↔ 각가속도.
  cards: [phys-rot-torque, phys-rot-rotational-energy]

# ---------------------------------------------------------------- 진동과 파동
- id: qw-spring-period-mass
  chapter: waves
  type: ratio
  q: 용수철 진자의 질량을 4배로 하면 주기는 몇 배인가?
  choices:
    - $2$배
    - $4$배
    - $\dfrac{1}{2}$배
    - $16$배
  answer: 0
  explain: $T = 2\pi\sqrt{\dfrac{m}{k}} \propto \sqrt m$.
  cards: [phys-wave-spring-shm]

- id: qw-pendulum-mass
  chapter: waves
  type: tf
  q: 단진자의 추를 더 무거운 것으로 바꾸면 주기가 길어진다.
  answer: false
  explain: $T = 2\pi\sqrt{\dfrac{L}{g}}$에는 질량이 없다. 길이와 중력가속도만 주기를 바꾼다.
  cards: [phys-wave-pendulums]

- id: qw-vertical-spring
  chapter: waves
  type: tf
  q: 같은 용수철 진자를 수평으로 놓을 때와 연직으로 매달 때의 주기는 같다.
  answer: true
  explain: 연직으로 매달면 평형 위치만 $\dfrac{mg}{k}$만큼 내려갈 뿐, 그 평형점을 중심으로 같은 $\omega = \sqrt{k/m}$로 진동한다.
  cards: [phys-wave-spring-shm]

- id: qw-shm-max
  chapter: waves
  type: concept
  q: 단진동하는 물체가 평형 위치를 지날 때에 대한 설명으로 옳은 것은?
  choices:
    - 속력이 최대이고 가속도는 0이다
    - 속력과 가속도가 모두 최대이다
    - 속력이 0이고 가속도가 최대이다
    - 속력과 가속도가 모두 0이다
  answer: 0
  explain: $a = -\omega^2x$라서 $x = 0$이면 가속도 0. 에너지가 전부 운동 에너지라 속력은 최대 $\omega x_m$. 양 끝에서는 반대로 속력 0, 가속도 최대.
  cards: [phys-wave-shm, phys-wave-shm-energy]

- id: qw-shm-energy-half
  chapter: waves
  type: ratio
  q: 단진동에서 운동 에너지와 퍼텐셜 에너지가 같아지는 위치는? (진폭 $x_m$)
  choices:
    - $\pm\dfrac{x_m}{\sqrt2}$
    - $\pm\dfrac{x_m}{2}$
    - $0$
    - $\pm x_m$
  answer: 0
  explain: $U = \dfrac{1}{2}kx^2 = \dfrac{1}{2}E = \dfrac{1}{4}kx_m^2$에서 $x = \dfrac{x_m}{\sqrt2}$. 진폭의 절반이 아니다.
  cards: [phys-wave-shm-energy]

- id: qw-wave-speed-medium
  chapter: waves
  type: concept
  q: 같은 줄에서 진동수를 2배로 올렸을 때 옳은 것은?
  choices:
    - 속력은 그대로이고 파장이 절반이 된다
    - 파장은 그대로이고 속력이 2배가 된다
    - 속력과 파장이 모두 2배가 된다
    - 속력이 절반이 된다
  answer: 0
  explain: 파동의 속력은 매질(줄의 장력·선밀도)이 정한다. $v = f\lambda$가 일정하므로 $f$가 2배면 $\lambda$가 절반.
  cards: [phys-wave-traveling-wave, phys-wave-string-speed]

- id: qw-string-tension
  chapter: waves
  type: ratio
  q: 줄의 장력을 4배로 하면 줄에서 파동의 속력은 몇 배인가?
  choices:
    - $2$배
    - $4$배
    - $16$배
    - $\dfrac{1}{2}$배
  answer: 0
  explain: $v = \sqrt{\dfrac{\tau}{\mu}}$라서 장력의 제곱근에 비례한다.
  cards: [phys-wave-string-speed]

- id: qw-wave-sign
  chapter: waves
  type: concept
  q: $y = y_m\sin(kx + \omega t)$로 표현되는 파동의 진행 방향은?
  choices:
    - $-x$ 방향
    - $+x$ 방향
    - 진행하지 않는 정상파
    - $+y$ 방향
  answer: 0
  explain: $kx$와 $\omega t$의 부호가 같으면 $-x$ 방향, 다르면($kx - \omega t$) $+x$ 방향으로 진행한다.
  cards: [phys-wave-traveling-wave]

- id: qw-intensity-distance
  chapter: waves
  type: ratio
  q: 사방으로 고르게 퍼지는 점음원에서 거리가 3배가 되면 소리의 세기는 몇 배인가?
  choices:
    - $\dfrac{1}{9}$배
    - $\dfrac{1}{3}$배
    - $\dfrac{1}{27}$배
    - $\dfrac{1}{\sqrt3}$배
  answer: 0
  explain: 일률이 구면 넓이 $4\pi r^2$에 퍼지므로 $I = \dfrac{P}{4\pi r^2} \propto \dfrac{1}{r^2}$. 진폭은 $\dfrac{1}{r}$에 비례.
  cards: [phys-wave-wave-power-intensity]

- id: qw-interference-half
  chapter: waves
  type: concept
  q: 같은 위상의 두 음원에서 온 소리의 경로차가 $\dfrac{\lambda}{2}$인 곳에서는?
  choices:
    - 상쇄 간섭 (가장 작게 들림)
    - 보강 간섭 (가장 크게 들림)
    - 진폭이 $\sqrt2$배
    - 진동수가 절반이 됨
  answer: 0
  explain: 경로차가 $\lambda$의 정수배면 보강, 반정수배($\dfrac{\lambda}{2}, \dfrac{3\lambda}{2}, \ldots$)면 상쇄. 진동수는 간섭으로 변하지 않는다.
  cards: [phys-wave-interference]

- id: qw-closed-pipe
  chapter: waves
  type: concept
  q: 한쪽 끝만 막힌 관(길이 $L$)에서 생길 수 있는 소리에 대한 설명으로 옳은 것은?
  choices:
    - 기본 파장은 $4L$이고 홀수 배음만 생긴다
    - 기본 파장은 $2L$이고 모든 배음이 생긴다
    - 기본 파장은 $4L$이고 짝수 배음만 생긴다
    - 기본 파장은 $L$이다
  answer: 0
  explain: 막힌 끝은 마디, 열린 끝은 배라서 기본 진동은 $\dfrac{\lambda}{4} = L$. 이후 $\lambda_n = \dfrac{4L}{n}$ ($n = 1, 3, 5, \ldots$). 양끝 열림·양끝 고정은 $\dfrac{2L}{n}$, 모든 $n$.
  cards: [phys-wave-standing-wave]

- id: qw-doppler-direction
  chapter: waves
  type: concept
  q: 음원이 관찰자에게서 멀어질 때 관찰자가 듣는 소리는?
  choices:
    - 진동수가 낮아진다
    - 진동수가 높아진다
    - 진동수는 그대로이고 소리만 작아진다
    - 음속이 느려진다
  answer: 0
  explain: 멀어지면 파면 간격(파장)이 늘어나 진동수가 낮게 들린다. 공기 속 음속은 음원의 운동과 관계없이 매질이 정한다.
  cards: [phys-wave-doppler]

# ---------------------------------------------------------------- 유체
- id: qf-pressure-shape
  chapter: fluids
  type: tf
  q: 같은 액체를 담은 그릇이라면, 바닥의 압력은 그릇 모양과 관계없이 수면에서 바닥까지의 깊이로 정해진다.
  answer: true
  explain: $P = P_0 + \rho gh$에는 깊이만 들어간다 (정수압 역설). 바닥이 받는 **힘**은 바닥 넓이에 따라 다르다.
  cards: [phys-fluid-hydrostatic-pressure]

- id: qf-buoyancy-depth
  chapter: fluids
  type: concept
  q: 물에 완전히 잠긴 돌을 더 깊이 내렸을 때 부력은?
  choices:
    - 변하지 않는다
    - 깊이에 비례해 커진다
    - 작아진다
    - 돌의 무게와 같아진다
  answer: 0
  explain: 부력 $F_B = \rho_{\text{fluid}}Vg$는 잠긴 부피로만 정해진다. 위아래 압력이 함께 커져서 그 차이는 그대로다.
  cards: [phys-fluid-buoyancy]

- id: qf-ice-fraction
  chapter: fluids
  type: ratio
  q: 밀도가 물의 $0.9$배인 얼음이 물에 떠 있다. 물에 잠긴 부피는 전체의 몇 %인가?
  choices:
    - $90\%$
    - $10\%$
    - $50\%$
    - $100\%$
  answer: 0
  explain: 뜬 물체는 무게 = 부력이라 $\dfrac{V_{\text{잠김}}}{V} = \dfrac{\rho_{\text{물체}}}{\rho_{\text{유체}}} = 0.9$.
  cards: [phys-fluid-buoyancy]

- id: qf-continuity-area
  chapter: fluids
  type: ratio
  q: 관의 지름이 절반으로 좁아지는 곳에서 물의 속력은 몇 배가 되는가?
  choices:
    - $4$배
    - $2$배
    - $\dfrac{1}{2}$배
    - $\sqrt2$배
  answer: 0
  explain: $A_1v_1 = A_2v_2$이고 단면적은 지름의 제곱에 비례한다. 지름이 절반이면 넓이 $\dfrac{1}{4}$, 속력 4배.
  cards: [phys-fluid-continuity]

- id: qf-bernoulli-fast-low
  chapter: fluids
  type: concept
  q: 같은 높이의 수평관에서 관이 좁아지는 곳의 압력은?
  choices:
    - 더 낮다
    - 더 높다
    - 같다
    - 관의 길이에 따라 다르다
  answer: 0
  explain: 좁은 곳에서 빨라지고(연속 방정식), 높이가 같으면 $P + \dfrac{1}{2}\rho v^2$이 일정하므로 빠른 곳의 압력이 낮다.
  cards: [phys-fluid-bernoulli, phys-fluid-continuity]

- id: qf-torricelli
  chapter: fluids
  type: ratio
  q: 수면에서 깊이 $h$인 작은 구멍으로 나오는 물의 속력은?
  choices:
    - $\sqrt{2gh}$
    - $\sqrt{gh}$
    - $2gh$
    - $\dfrac{1}{2}gh$
  answer: 0
  explain: 베르누이 식(토리첼리 정리). 높이 $h$에서 자유 낙하한 속력과 같다.
  cards: [phys-fluid-bernoulli]

- id: qf-pascal
  chapter: fluids
  type: ratio
  q: 유압기에서 큰 피스톤의 넓이가 작은 피스톤의 50배이다. 작은 피스톤을 $10\,\text{N}$으로 누르면 큰 피스톤이 받는 힘은?
  choices:
    - $500\,\text{N}$
    - $10\,\text{N}$
    - $50\,\text{N}$
    - $0.2\,\text{N}$
  answer: 0
  explain: 파스칼의 원리로 압력이 같아 $\dfrac{F_1}{A_1} = \dfrac{F_2}{A_2}$. 대신 큰 피스톤이 움직이는 거리는 $\dfrac{1}{50}$이라 일은 같다.
  cards: [phys-fluid-pascal]

# ---------------------------------------------------------------- 열역학
- id: qt-first-law-sign
  chapter: thermodynamics
  type: concept
  q: $\Delta E_{\text{int}} = Q - W$ 규약에서, 기체가 열 $100\,\text{J}$을 받고 외부에 $30\,\text{J}$의 일을 했다. 내부 에너지 변화는?
  choices:
    - $+70\,\text{J}$
    - $+130\,\text{J}$
    - $-70\,\text{J}$
    - $-130\,\text{J}$
  answer: 0
  explain: 이 규약에서 $W$는 기체가 **한** 일이다. $100 - 30 = 70$. 교재에 따라 $\Delta U = Q + W$($W$ = 기체가 **받은** 일)로 쓰기도 하니 규약을 먼저 본다.
  cards: [phys-thermo-first-law]

- id: qt-isothermal-u
  chapter: thermodynamics
  type: tf
  q: 이상기체의 등온 과정에서는 내부 에너지가 변하지 않으므로, 받은 열은 모두 외부에 한 일이 된다.
  answer: true
  explain: 이상기체의 내부 에너지는 온도만의 함수라 등온이면 $\Delta E_{\text{int}} = 0$, 곧 $Q = W$.
  cards: [phys-thermo-first-law]

- id: qt-adiabatic
  chapter: thermodynamics
  type: concept
  q: 기체가 단열 팽창할 때 온도가 내려가는 이유는?
  choices:
    - 열을 받지 않은 채 외부에 일을 해서 내부 에너지가 줄기 때문
    - 열이 밖으로 빠져나가기 때문
    - 압력이 일정하기 때문
    - 부피가 늘면 분자 수가 줄기 때문
  answer: 0
  explain: 단열이면 $Q = 0$이라 $\Delta E_{\text{int}} = -W$. 팽창하면 $W > 0$이므로 내부 에너지(온도)가 내려간다.
  cards: [phys-thermo-first-law]

- id: qt-entropy-state
  chapter: thermo-entropy
  type: concept
  q: 다음 중 상태함수가 **아닌** 것은?
  choices:
    - 열 $Q$
    - 엔트로피 $S$
    - 내부 에너지 $E_{\text{int}}$
    - 온도 $T$
  answer: 0
  explain: 열과 일은 경로에 따라 달라지는 양이다. 엔트로피·내부 에너지·온도·압력·부피는 상태만으로 정해진다.
  cards: [thermo-entropy-state-function]

- id: qt-free-expansion
  chapter: thermo-entropy
  type: concept
  q: 이상기체가 단열된 용기 안에서 진공으로 자유 팽창해 부피가 2배가 되었다. 엔트로피 변화는?
  choices:
    - $nR\ln 2$ (증가)
    - $0$ ($Q = 0$이므로)
    - $-nR\ln 2$ (감소)
    - $nC_V\ln 2$
  answer: 0
  explain: 실제 과정은 $Q = 0$이지만 비가역이라 $\int dQ/T$를 그대로 쓸 수 없다. 처음·나중 상태가 같은 등온 가역 팽창으로 우회하면 $\Delta S = nR\ln\dfrac{V_f}{V_i} = nR\ln 2$.
  cards: [thermo-entropy-irreversible, thermo-entropy-ideal-gas]

- id: qt-entropy-temp
  chapter: thermo-entropy
  type: tf
  q: 같은 양의 열을 가역적으로 받는다면, 온도가 낮은 계일수록 엔트로피가 더 크게 증가한다.
  answer: true
  explain: $\Delta S = \dfrac{Q}{T}$라서 $T$가 작을수록 크다. 열이 뜨거운 곳에서 차가운 곳으로 흐르면 전체 엔트로피가 느는 이유다.
  cards: [thermo-entropy-reversible]

- id: qt-boltzmann-log
  chapter: thermo-entropy
  type: concept
  q: 볼츠만 엔트로피 $S = k_B\ln\Omega$에 로그를 쓰는 이유는?
  choices:
    - 두 계를 합치면 경우의 수는 곱해지지만 엔트로피는 더해져야 하므로
    - 경우의 수가 음수일 수 있으므로
    - 온도와 단위를 맞추기 위해
    - 엔트로피가 항상 1보다 작게 하려고
  answer: 0
  explain: $\Omega = \Omega_1\Omega_2$일 때 $\ln\Omega = \ln\Omega_1 + \ln\Omega_2$라서 $S = S_1 + S_2$가 된다.
  cards: [thermo-entropy-boltzmann]

  type: concept
  q: 책상 위에 정지한 책에 대한 설명으로 **틀린** 것은?
  choices:
    - 책이 받는 중력과 수직항력은 크기가 같다
    - 책이 받는 중력과 수직항력은 작용·반작용 쌍이다
    - 책이 책상을 누르는 힘의 반작용은 책상이 책을 미는 힘이다
    - 책이 받는 중력의 반작용은 책이 지구를 당기는 힘이다
  answer: 1
  explain: 중력과 수직항력은 **같은 물체(책)**에 작용하는 두 힘이라 "힘의 평형"이다. 작용·반작용은 항상 **서로 다른 두 물체**에 작용하고, 종류도 같다 (중력 ↔ 중력, 접촉력 ↔ 접촉력).

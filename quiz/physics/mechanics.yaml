  chapter: rotation
  type: concept
  q: 구심력에 대한 설명으로 **틀린** 것은?
  choices:
    - 원운동하면 중력·장력 외에 구심력이라는 힘이 하나 더 생긴다
    - 원의 중심을 향하는 알짜힘을 구심력이라 부른다
    - 크기는 $\dfrac{mv^2}{r}$이다
    - 줄의 장력이나 마찰력이 구심력 역할을 할 수 있다
  answer: 0
  explain: 구심력은 새로운 힘이 아니라 이미 있는 힘들의 중심 방향 합력이다. 힘 그림에 "구심력"을 따로 그리면 이중으로 센다.
  cards: [phys-rot-centripetal-force]

- id: qr-loop-top
  chapter: rotation
  type: ratio
  q: 반지름 $r$인 연직 원을 도는 물체(줄에 매달림)가 꼭대기에서 줄이 늘어지지 않을 최소 속력은?
  choices:
    - $\sqrt{gr}$
    - $\sqrt{2gr}$
    - $\sqrt{5gr}$
    - $0$
  answer: 0
  explain: 꼭대기에서 $mg + T = \dfrac{mv^2}{r}$이고 장력 $T \ge 0$이므로 $v \ge \sqrt{gr}$. $\sqrt{5gr}$은 그러기 위해 바닥에서 필요한 속력.
  cards: [phys-rot-centripetal-force]

- id: qr-symbol-alpha
  chapter: rotation
  type: concept
  q: 회전 운동 공식 $\tau = I\alpha$에서 직선 운동의 $m$에 대응하는 것은?
  choices:

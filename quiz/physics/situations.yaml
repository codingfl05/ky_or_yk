# 상황 → 공식·법칙. 문제: "이 상황에 쓰는 공식·법칙은?" + prompts 중 하나.
# 보기 4개 = 정답(label) + 같은 구분(역학 / 전자기·회로)의 다른 항목 3개 (같은 단원을 먼저 뽑음).
# avoid: 이 상황에도 답이 될 수 있어서 오답 보기로 나오면 안 되는 카드 (양방향으로 적용됨).
# 규칙은 CLAUDE.md "퀴즈".

# ---------------------------------------------------------------- 역학
- card: phys-mech-uniform-acceleration
  label: 등가속도 운동 공식
  prompts:
    - 일정한 가속도로 달리던 차가 멈출 때까지 미끄러진 거리를 시간 없이 구한다
    - 정지 상태에서 출발해 일정하게 가속한 물체의 3초 뒤 속도를 구한다
- card: phys-mech-projectile
  label: 포물선 운동 (수평·연직 분리)
  prompts:
    - 비스듬히 던진 공의 최고점 높이와 수평 도달 거리를 구한다
    - 수평으로 던진 물체가 땅에 닿을 때까지 걸린 시간을 구한다
- card: phys-mech-relative-velocity
  label: 상대 속도
  prompts:
    - 강물이 흐를 때 배가 강을 똑바로 건너려면 뱃머리를 어느 쪽으로 향해야 하는지 구한다
    - 마주 달리는 두 기차 중 한 기차에 탄 사람이 본 다른 기차의 속도를 구한다
- card: phys-mech-newton-second-law
  label: 뉴턴 운동 제2법칙
  prompts:
    - 여러 힘을 받는 물체의 가속도를 알짜힘으로 구한다
  avoid: [phys-mech-connected-bodies]
- card: phys-mech-newton-first-third
  label: 작용·반작용 법칙
  prompts:
    - 사람이 벽을 밀 때 벽이 사람을 미는 힘의 크기와 방향을 판단한다
    - 책상 위 책의 무게와 쌍을 이루는 반작용이 무엇인지 고른다
- card: phys-mech-normal-friction
  label: 수직항력과 마찰력 (빗면)
  prompts:
    - 거친 빗면 위에 놓인 상자가 미끄러지기 시작하는 각도를 구한다
    - 수평면에서 상자를 비스듬히 위로 당길 때의 운동 마찰력을 구한다
- card: phys-mech-spring-tension-drag
  label: 탄성력·장력·항력
  prompts:
    - 공기 저항을 받으며 떨어지는 빗방울의 종단 속력을 구한다
    - 용수철을 늘였을 때 용수철이 당기는 힘의 크기와 방향을 구한다
- card: phys-mech-connected-bodies
  label: 연결된 물체 (한 덩어리로 보기)
  prompts:
    - 도르래에 줄로 연결된 두 물체(애트우드 기계)의 가속도와 줄의 장력을 구한다
    - 수평면에서 붙어 있는 두 상자를 밀 때 두 상자가 서로 미는 힘을 구한다
  avoid: [phys-mech-newton-second-law]
- card: phys-mech-work
  label: 일 (힘 × 변위)
  prompts:
    - 위치에 따라 크기가 변하는 힘이 물체를 옮기며 한 일을 F–x 그래프 넓이로 구한다
    - 비스듬한 방향으로 당긴 줄이 썰매에 한 일을 구한다
- card: phys-mech-work-energy-theorem
  label: 일-운동 에너지 정리
  prompts:
    - 알짜힘이 한 일로 물체의 나중 속력을 구한다
    - 마찰력이 한 일만큼 줄어든 운동 에너지로 미끄러진 거리를 구한다
  avoid: [phys-mech-energy-conservation, phys-mech-work]
- card: phys-mech-power
  label: 일률
  prompts:
    - 일정한 속력으로 짐을 끌어올리는 모터가 1초에 하는 일을 구한다
    - 자동차 엔진의 출력과 속력으로 차가 받는 견인력을 구한다
- card: phys-mech-conservative-potential
  label: 보존력과 퍼텐셜 에너지
  prompts:
    - 퍼텐셜 에너지 그래프 U(x)에서 각 위치의 힘의 방향과 평형점을 읽는다
    - 경로가 달라도 중력이 한 일이 같은 이유를 설명한다
- card: phys-mech-energy-conservation
  label: 역학적 에너지 보존
  prompts:
    - 마찰 없는 롤러코스터의 높은 곳에서 출발한 수레의 낮은 곳 속력을 구한다
    - 용수철에 압축된 공이 튀어 올라 도달하는 최고 높이를 구한다
  avoid: [phys-mech-work-energy-theorem, phys-rot-rolling, phys-wave-shm-energy]
- card: phys-mech-momentum-impulse
  label: 운동량과 충격량
  prompts:
    - 공을 받는 시간을 늘리면 손이 받는 평균 힘이 줄어드는 이유를 설명한다
    - 힘–시간 그래프의 넓이로 공의 속도 변화를 구한다
  avoid: [phys-mech-newton-second-law]
- card: phys-mech-momentum-conservation
  label: 운동량 보존과 충돌
  prompts:
    - 정지한 물체에 부딪혀 한 덩어리가 된 두 물체의 충돌 직후 속도를 구한다
    - 탄성 충돌 후 두 물체의 나중 속도를 구한다
    - 정지한 대포가 포탄을 쏜 뒤 대포가 뒤로 밀리는 속도를 구한다
  avoid: [phys-mech-center-of-mass]
- card: phys-mech-center-of-mass
  label: 질량 중심
  prompts:
    - 폭발한 포탄 조각들의 질량 중심이 그리는 경로를 구한다
    - 정지한 배 위에서 사람이 걸어갈 때 배가 움직인 거리를 구한다
  avoid: [phys-mech-momentum-conservation]
- card: phys-mech-static-equilibrium
  label: 정적 평형 (힘·돌림힘 평형)
  prompts:
    - 벽에 기대 세운 사다리가 미끄러지지 않을 조건을 구한다
    - 두 받침대 위에 놓인 판자 위에 사람이 섰을 때 각 받침대가 받치는 힘을 구한다
- card: phys-mech-gravitation
  label: 만유인력 법칙
  prompts:
    - 지구 표면에서 높이 R만큼 올라간 곳의 중력가속도를 구한다
    - 지구 내부 깊은 곳(반지름 r < R)에서 물체가 받는 중력을 구한다
  avoid: [phys-mech-gravitational-potential]
- card: phys-mech-gravitational-potential
  label: 중력 퍼텐셜 에너지와 탈출 속력
  prompts:
    - 지표면에서 물체를 쏘아 지구 중력을 벗어나게 하는 최소 속력을 구한다
    - 높이가 지구 반지름과 비슷할 때 mgh 대신 써야 하는 퍼텐셜 에너지 식을 고른다
- card: phys-mech-orbits-kepler
  label: 원궤도 운동과 케플러 법칙
  prompts:
    - 궤도 반지름이 4배인 위성의 공전 주기가 몇 배인지 구한다
    - 원궤도를 도는 인공위성의 속력과 역학적 에너지를 구한다
  avoid: [phys-mech-gravitation, phys-mech-gravitational-potential]

# ---------------------------------------------------------------- 회전
- card: phys-rot-rotational-kinematics
  label: 회전 운동의 기술 (각속도·각가속도)
  prompts:
    - 일정한 각가속도로 돌기 시작한 바퀴가 5초 동안 돈 바퀴 수를 구한다
    - 회전하는 원판 가장자리 점의 접선 가속도를 각가속도로 구한다
- card: phys-rot-centripetal-force
  label: 구심력과 원운동
  prompts:
    - 줄에 매달아 연직으로 돌리는 물체가 꼭대기에서 줄이 늘어지지 않을 최소 속력을 구한다
    - 마찰로만 커브를 도는 자동차가 미끄러지지 않을 최대 속력을 구한다
- card: phys-rot-moment-of-inertia
  label: 관성모멘트
  prompts:
    - 질량과 반지름이 같은 고리와 원판 중 같은 돌림힘에 더 천천히 회전이 빨라지는 쪽을 고른다
    - 중심을 지나는 축에 대한 막대의 회전 관성을 구한다
  avoid: [phys-rot-torque, phys-rot-parallel-axis]
- card: phys-rot-parallel-axis
  label: 평행축 정리
  prompts:
    - 막대의 한쪽 끝을 지나는 축에 대한 관성모멘트를 중심축 값으로 구한다
    - 원판의 가장자리를 지나는 축에 대한 관성모멘트를 구한다
  avoid: [phys-rot-moment-of-inertia]
- card: phys-rot-torque
  label: 돌림힘과 회전 운동 법칙
  prompts:
    - 도르래에 감긴 줄에 매달린 추가 떨어질 때 도르래의 각가속도를 구한다
    - 문 손잡이를 경첩에서 먼 곳에 다는 이유를 설명한다
- card: phys-rot-rotational-energy
  label: 회전 운동 에너지
  prompts:
    - 돌고 있는 플라이휠에 저장된 에너지를 구한다
    - 일정한 돌림힘이 바퀴를 한 바퀴 돌리며 한 일을 구한다
- card: phys-rot-rolling
  label: 구름 운동
  prompts:
    - 같은 빗면을 미끄러지지 않고 굴러 내려오는 구와 원통 중 먼저 도착하는 것을 고른다
    - 미끄러지지 않고 구르는 바퀴 맨 위 점의 속력을 구한다
  avoid: [phys-mech-energy-conservation, phys-rot-rotational-energy, phys-rot-moment-of-inertia]
- card: phys-rot-angular-momentum
  label: 각운동량 보존
  prompts:
    - 회전하는 피겨 선수가 팔을 오므렸을 때 각속도가 커지는 이유를 설명한다
    - 회전하는 원판 위에 다른 원판을 살짝 떨어뜨려 함께 돌 때의 각속도를 구한다
- card: phys-rot-precession
  label: 자이로스코프 세차 운동
  prompts:
    - 한쪽 끝만 받친 채 빠르게 도는 팽이 축이 쓰러지지 않고 수평으로 천천히 도는 각속도를 구한다

# ---------------------------------------------------------------- 진동과 파동
- card: phys-wave-shm
  label: 단진동의 위치·속도·가속도
  prompts:
    - 단진동하는 물체의 최대 속력과 최대 가속도를 진폭과 각진동수로 구한다
    - 위치 그래프의 위상으로 t = 0일 때 물체의 운동 방향을 판단한다
  avoid: [phys-wave-shm-energy, phys-wave-spring-shm]
- card: phys-wave-spring-shm
  label: 용수철 진자
  prompts:
    - 용수철에 매단 물체의 질량을 4배로 하면 주기가 몇 배인지 구한다
    - 연직으로 매단 용수철 진자의 평형 위치가 얼마나 내려가는지 구한다
- card: phys-wave-shm-energy
  label: 단진동의 에너지
  prompts:
    - 단진동하는 물체의 운동 에너지와 퍼텐셜 에너지가 같아지는 위치를 구한다
    - 진폭과 용수철 상수만으로 단진동의 전체 에너지를 구한다
  avoid: [phys-mech-energy-conservation]
- card: phys-wave-pendulums
  label: 단진자·물리 진자
  prompts:
    - 달에서 같은 시계추의 주기가 어떻게 바뀌는지 구한다
    - 한쪽 끝을 매단 막대가 흔들리는 주기를 구한다
- card: phys-wave-traveling-wave
  label: 진행파의 식
  prompts:
    - y = y_m sin(kx − ωt) 꼴의 식에서 파장과 진행 방향을 읽는다
    - 진동수와 파장으로 파동의 속력을 구한다
- card: phys-wave-string-speed
  label: 줄의 파동 속력
  prompts:
    - 기타 줄의 장력을 4배로 하면 줄에서 파동의 속력이 몇 배인지 구한다
    - 선밀도가 다른 두 줄을 이었을 때 어느 쪽에서 파동이 더 느린지 판단한다
- card: phys-wave-wave-power-intensity
  label: 파동의 일률과 세기
  prompts:
    - 점음원에서 거리가 2배가 되면 소리의 세기가 몇 배인지 구한다
    - 줄을 따라 전달되는 파동의 평균 일률이 진폭에 어떻게 비례하는지 구한다
- card: phys-wave-interference
  label: 파동의 간섭
  prompts:
    - 두 스피커에서 나온 소리의 경로차가 반파장일 때 그 자리의 소리 세기를 판단한다
    - 위상차가 φ인 같은 두 파동을 더한 합성 진폭을 구한다
- card: phys-wave-standing-wave
  label: 정상파와 경계 조건
  prompts:
    - 한쪽 끝이 막힌 관에서 낼 수 있는 가장 낮은 소리의 파장을 구한다
    - 양끝이 고정된 줄의 3번째 배음 진동수를 구한다
- card: phys-wave-doppler
  label: 도플러 효과
  prompts:
    - 다가오는 구급차 사이렌 소리가 원래보다 높게 들리는 진동수를 구한다
    - 정지한 음원 쪽으로 달려가는 관찰자가 듣는 진동수를 구한다

# ---------------------------------------------------------------- 유체
- card: phys-fluid-hydrostatic-pressure
  label: 깊이에 따른 압력
  prompts:
    - 수심 10 m인 곳의 절대 압력을 구한다
    - U자관 양쪽에 다른 액체를 넣었을 때 높이 차로 밀도를 비교한다
  avoid: [phys-fluid-pascal]
- card: phys-fluid-pascal
  label: 파스칼의 원리
  prompts:
    - 작은 피스톤을 눌러 큰 피스톤 위의 자동차를 들어 올리는 유압기의 힘을 구한다
- card: phys-fluid-buoyancy
  label: 부력 (아르키메데스 원리)
  prompts:
    - 물에 뜬 얼음이 수면 아래에 잠긴 부피의 비율을 구한다
    - 물속에 완전히 잠긴 돌을 저울로 잴 때 줄어든 눈금을 구한다
- card: phys-fluid-continuity
  label: 연속 방정식
  prompts:
    - 호스 끝을 손가락으로 막아 단면을 줄이면 물이 빨라지는 정도를 구한다
  avoid: [phys-fluid-bernoulli]
- card: phys-fluid-bernoulli
  label: 베르누이 방정식
  prompts:
    - 물통 옆 작은 구멍에서 나오는 물의 속력을 구한다 (토리첼리)
    - 굵기가 다른 수평관에서 좁은 곳의 압력이 더 낮은 이유를 설명한다
  avoid: [phys-fluid-continuity]

# ---------------------------------------------------------------- 열역학
- card: phys-thermo-first-law
  label: 열역학 제1법칙
  prompts:
    - 기체가 받은 열과 외부에 한 일로 내부 에너지 변화를 구한다
    - 단열 팽창하는 기체의 온도가 내려가는 이유를 설명한다
- card: thermo-entropy-reversible
  label: 가역 과정의 엔트로피 변화 (∫dQ/T)
  prompts:
    - 0°C 얼음 1 kg이 녹을 때 얼음의 엔트로피 변화를 구한다
- card: thermo-entropy-irreversible
  label: 가역 경로로 우회한 엔트로피 계산
  prompts:
    - 단열 자유 팽창처럼 Q = 0인 비가역 과정의 엔트로피 변화를 구하는 방법을 고른다
  avoid: [thermo-entropy-ideal-gas, thermo-entropy-state-function]
- card: thermo-entropy-ideal-gas
  label: 이상기체의 엔트로피 변화 식
  prompts:
    - 이상기체를 등온으로 부피 2배 팽창시킬 때의 엔트로피 변화를 구한다
    - 처음·나중 온도와 부피만 주어진 이상기체의 엔트로피 변화를 구한다
  avoid: [thermo-entropy-irreversible]
- card: thermo-entropy-boltzmann
  label: 볼츠만 엔트로피 (S = k ln Ω)
  prompts:
    - 동전 배열처럼 경우의 수를 셀 수 있는 상태의 엔트로피를 구한다

# ---------------------------------------------------------------- 전자기학
- card: phys-em-coulomb-law
  label: 쿨롱 법칙
  prompts:
    - 두 점전하 사이 거리를 2배로 하면 전기력이 몇 배인지 구한다
    - 같은 크기로 대전된 두 금속구를 접촉시켰다 떼었을 때의 힘을 구한다
- card: phys-em-electric-field
  label: 점전하의 전기장 (중첩)
  prompts:
    - 정삼각형 꼭짓점에 놓인 점전하 셋이 중심에 만드는 전기장을 벡터로 더한다
    - 두 점전하를 잇는 직선 위에서 전기장이 0인 점을 찾는다
- card: phys-em-infinitesimal-elements
  label: 쪼개서 더하기 (미소 요소 적분)
  prompts:
    - 유한한 길이의 대전 막대가 연장선 위 한 점에 만드는 전기장을 구한다
    - 폭이 있는 얇은 도체판에 흐르는 전류가 옆 점에 만드는 자기장을 구한다
  avoid: [phys-em-symmetry-cancellation, phys-em-biot-savart]
- card: phys-em-symmetry-cancellation
  label: 대칭으로 상쇄되는 성분
  prompts:
    - 균일하게 대전된 원형 고리의 축 위에서 축에 수직인 전기장 성분이 사라지는 이유를 고른다
  avoid: [phys-em-infinitesimal-elements, phys-em-potential-distributions]
- card: phys-em-electric-dipole
  label: 전기 쌍극자
  prompts:
    - 균일한 전기장 속에서 쌍극자가 받는 돌림힘과 가장 안정한 방향을 구한다
    - 먼 거리에서 +q, −q 쌍이 만드는 전기장이 1/r³로 줄어드는 이유를 고른다
- card: phys-em-gauss-law
  label: 가우스 법칙
  prompts:
    - 폐곡면 안의 전하만 주어졌을 때 그 곡면을 지나는 전기선속을 구한다
    - 정육면체 중심에 놓인 점전하가 한 면을 지나게 하는 선속을 구한다
  avoid: [phys-em-gauss-applications]
- card: phys-em-gauss-applications
  label: 가우스 법칙의 대표 전기장
  prompts:
    - 균일하게 대전된 부도체 구 내부(r < R)의 전기장을 구한다
    - 무한히 긴 대전 직선에서 거리 r인 곳의 전기장을 구한다
  avoid: [phys-em-gauss-law]
- card: phys-em-conductors
  label: 정전기 평형의 도체
  prompts:
    - 대전된 금속 껍질 안쪽 빈 공간의 전기장을 구한다
    - 도체 표면 바로 바깥의 전기장을 표면 전하 밀도로 구한다
- card: phys-em-electric-potential
  label: 전위와 전기장의 관계
  prompts:
    - 균일한 전기장 속에서 전기장 방향으로 d만큼 이동했을 때의 전위차를 구한다
    - 전위가 높은 곳에서 낮은 곳으로 가속된 전자가 얻은 운동 에너지를 구한다
- card: phys-em-potential-distributions
  label: 대표 전하 분포의 전위
  prompts:
    - 균일하게 대전된 고리의 축 위 한 점의 전위를 구한다
    - 여러 점전하가 한 점에 만드는 전위를 스칼라로 더한다
  avoid: [phys-em-electric-potential, phys-em-infinitesimal-elements]
- card: phys-em-capacitance
  label: 전기용량 (평행판·원통·구)
  prompts:
    - 평행판 축전기의 판 간격을 2배로 하면 전기용량이 몇 배인지 구한다
    - 동축 원통형 축전기의 단위 길이당 전기용량을 구한다
- card: phys-em-capacitor-energy
  label: 축전기 에너지와 에너지 밀도
  prompts:
    - 충전된 축전기에 저장된 에너지를 전하와 전압으로 구한다
    - 평행판 사이 공간의 단위 부피당 전기장 에너지를 구한다
- card: phys-em-dielectric
  label: 유전체를 넣은 축전기
  prompts:
    - 전지를 뗀 축전기에 유전체를 끼우면 전압이 어떻게 변하는지 판단한다
    - 전지에 연결된 채 유전체를 끼우면 저장 에너지가 어떻게 변하는지 판단한다
- card: phys-em-current-drift
  label: 전류 밀도와 유동 속력
  prompts:
    - 구리 도선 속 전자의 유동 속력을 전류와 단면적으로 구한다
- card: phys-em-ohm-law
  label: 옴의 법칙과 비저항
  prompts:
    - 같은 물질의 도선 길이를 2배, 지름을 2배로 하면 저항이 몇 배인지 구한다
    - 저항에서 열로 바뀌는 전력을 전류와 저항으로 구한다
- card: phys-em-lorentz-force
  label: 로렌츠 힘 (자기장 속 전하)
  prompts:
    - 균일한 자기장에 수직으로 들어온 양성자가 그리는 원의 반지름을 구한다
    - 전기장과 자기장이 함께 있을 때 직진하는 입자의 속력(속도 선택기)을 구한다
- card: phys-em-force-on-current
  label: 전류가 받는 자기력
  prompts:
    - 자기장 속 전류가 흐르는 도선 한 토막이 받는 힘을 구한다
    - 같은 방향으로 전류가 흐르는 평행한 두 도선이 서로 당기는지 미는지 판단한다
  avoid: [phys-em-ampere-law, phys-em-biot-savart]
- card: phys-em-magnetic-dipole
  label: 자기 쌍극자 (전류 고리의 돌림힘)
  prompts:
    - 자기장 속 직사각형 전류 고리가 받는 돌림힘의 최댓값을 구한다
    - 원궤도를 도는 전자의 자기쌍극자모멘트를 구한다
- card: phys-em-biot-savart
  label: 비오-사바르 법칙
  prompts:
    - 원형 전류 고리 중심의 자기장을 구한다
    - 원호 모양 도선이 원의 중심에 만드는 자기장을 구한다
  avoid: [phys-em-infinitesimal-elements]
- card: phys-em-ampere-law
  label: 앙페르 법칙
  prompts:
    - 굵은 원통 도선 내부(r < R)의 자기장을 구한다
    - 촘촘히 감은 긴 솔레노이드 내부의 자기장을 구한다
- card: phys-em-faraday-law
  label: 패러데이 법칙과 렌츠 법칙
  prompts:
    - 코일을 지나는 자기선속이 시간에 따라 변할 때 유도 기전력의 크기와 전류 방향을 구한다
    - 막대자석을 코일에 가까이 할 때 코일에 흐르는 전류의 방향을 판단한다
  avoid: [phys-em-motional-emf, phys-em-induced-electric-field]
- card: phys-em-motional-emf
  label: 운동 기전력 (BLv)
  prompts:
    - 자기장 속 레일 위를 속력 v로 미끄러지는 막대 양 끝의 기전력을 구한다
    - 자기장 속에서 한쪽 끝을 축으로 회전하는 금속 막대의 기전력을 구한다
  avoid: [phys-em-faraday-law]
- card: phys-em-induced-electric-field
  label: 유도 전기장
  prompts:
    - 세기가 변하는 솔레노이드 자기장이 바깥 원 위에 만드는 전기장을 구한다
  avoid: [phys-em-faraday-law]
- card: phys-em-inductance
  label: 인덕턴스와 자기 에너지
  prompts:
    - 솔레노이드의 자체유도계수를 감은 수와 단면적으로 구한다
    - 코일에 흐르는 전류로 코일에 저장된 에너지를 구한다
    - 코일 전류가 변할 때 생기는 역기전력의 크기를 구한다

# ---------------------------------------------------------------- 회로
- card: phys-circ-kirchhoff
  label: 키르히호프 법칙
  prompts:
    - 전지가 두 개 있는 복잡한 회로에서 각 갈래의 전류를 연립해서 구한다
    - 내부 저항이 있는 전지의 단자 전압을 구한다
- card: phys-circ-series-parallel
  label: 저항·축전기의 직렬·병렬 합성
  prompts:
    - 병렬로 연결한 두 저항의 합성 저항을 구한다
    - 직렬로 연결한 두 축전기의 합성 전기용량을 구한다
- card: phys-circ-rc-circuit
  label: RC 회로 (충전·방전)
  prompts:
    - 스위치를 닫은 직후 축전기에 흐르는 충전 전류를 구한다
    - 방전하는 축전기의 전하가 처음의 1/e이 되는 시간을 구한다
- card: phys-circ-rl-circuit
  label: RL 회로
  prompts:
    - 코일이 있는 회로에서 스위치를 닫은 직후 전류가 0인 이유와 시간 상수를 구한다
- card: phys-circ-lc-oscillation
  label: LC 진동 회로
  prompts:
    - 충전된 축전기를 코일에 연결했을 때 전하가 진동하는 각진동수를 구한다
    - LC 회로에서 축전기 에너지와 코일 에너지가 같아지는 순간의 전하를 구한다
- card: phys-circ-ac-elements
  label: 교류 회로의 R·C·L (리액턴스)
  prompts:
    - 교류 진동수를 2배로 하면 축전기의 리액턴스가 몇 배인지 구한다
    - 교류에서 코일의 전압이 전류보다 90° 앞서는지 뒤지는지 판단한다
- card: phys-circ-rlc-series
  label: RLC 직렬 회로 (임피던스·공명)
  prompts:
    - 교류 전원에 연결한 RLC 직렬 회로의 전류 진폭을 구한다
    - 전류가 가장 크게 흐르는 교류 진동수(공명 진동수)를 구한다
  avoid: [phys-circ-ac-elements]
- card: phys-circ-transformer
  label: 변압기
  prompts:
    - 1차 코일 100회, 2차 코일 1000회인 변압기의 2차 전압을 구한다
    - 송전할 때 전압을 높이면 송전선의 열 손실이 줄어드는 이유를 고른다

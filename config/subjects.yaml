# 과목 → 단원 구성.
# - 과목/단원을 추가·삭제·순서변경하려면 이 파일만 고치면 된다.
# - 단원 폴더: content/<subject id>/<chapter id>/
# - prefix: 그 단원 카드 id가 반드시 시작해야 하는 접두어 (예: phys-em-gauss-law)
# - name/name_en: content/<과목>/<단원>/_chapter.md가 있으면 그 title_ko/title_en이 우선 (그때는 생략 가능)
# - 단원이 1개뿐인 과목은 홈에서 바로 카드 목록으로 들어간다.

subjects:
  - id: calculus
    name: 미적분학
    name_en: Calculus
    chapters:
      - { id: differentiation, name: 미분, name_en: Differentiation, prefix: calc-diff }
      - { id: integration, name: 적분, name_en: Integration, prefix: calc-int }
      - { id: series, name: 급수, name_en: Series, prefix: calc }

  - id: linear-algebra
    name: 선형대수학
    name_en: Linear Algebra
    chapters:
      - { id: all, name: 전체, prefix: la }

  - id: diffeq
    name: 미분방정식
    name_en: Differential Equations
    chapters:
      - { id: first-order, name: 1계 미분방정식, name_en: First-order ODE, prefix: de-first }
      - { id: linear, name: 고계 선형 미분방정식, name_en: Higher-order linear ODE, prefix: de-linear }
      - { id: laplace, name: 라플라스 변환, name_en: Laplace transform, prefix: de-laplace }
      - { id: systems, name: 연립 미분방정식, name_en: Systems of ODEs, prefix: de-system }
      - { id: series, name: 급수해, name_en: Series solutions, prefix: de-series }

  - id: physics
    name: 일반물리
    name_en: General Physics
    chapters:
      - { id: mechanics, name: 역학, name_en: Mechanics, prefix: phys-mech }
      - { id: rotation, name: 회전운동, name_en: Rotational motion, prefix: phys-rot }
      - { id: waves, name: 파동, name_en: Waves, prefix: phys-wave }
      - { id: thermodynamics, name: 열역학, name_en: Thermodynamics, prefix: phys-thermo }
      - { id: electromagnetism, name: 전자기학, name_en: Electromagnetism, prefix: phys-em }
      - { id: circuits, name: 회로, name_en: Circuits, prefix: phys-circ }
      # 이름·소개는 content/physics/thermo-entropy/_chapter.md. 위치는 임시(맨 끝)
      - { id: thermo-entropy, prefix: thermo }

# Render Blueprint: Render 대시보드 → New → Blueprint → 이 repo 선택
services:
  - type: web
    name: ky-or-yk
    runtime: static
    # validate가 실패하면 빌드가 실패하고 배포되지 않는다 (npm run build = validate + astro build)
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
    headers:
      # 카드 데이터는 매번 새로 확인 (URL에 빌드 id가 붙어서 실제로는 캐시가 잘 맞음)
      - path: /data/*
        name: Cache-Control
        value: no-cache

# 공식 선택 흐름도. 노드: id, title, body(마크다운), options[{label, to}], cards[공식 카드 id], lessons[레슨 id]
# 선택지가 없는 노드가 결론이다. 시작 노드 id는 start.

- id: start
  title: 문제가 어느 세계의 이야기인가?
  body: 광속에 가까운 속력이 나오면 상대성 이론, 광자·전자의 파동이 나오면 양자, 원자핵이 나오면 핵물리다.
  options:
    - { label: "광속에 가까운 속력 (시간, 길이, 속도, 에너지)", to: rel }
    - { label: "빛을 입자로 본다 (광전 효과, X선 산란, 복사)", to: photon }
    - { label: "전자를 파동으로 본다 (물질파, 우물, 터널링)", to: wave }
    - { label: "수소 원자, 양자수, 각운동량", to: atom }
    - { label: "고체 (띠, 반도체, 다이오드)", to: solid }
    - { label: "원자핵 (붕괴, 반감기, 핵반응 에너지)", to: nuc }

# ------------------------------------------------------------ 상대성 이론
- id: rel
  title: 무엇을 구하라고 하는가?
  options:
    - { label: "두 관찰자가 잰 시간 간격", to: rel-time }
    - { label: "두 관찰자가 잰 길이, 거리", to: rel-length }
    - { label: "두 사건의 위치와 시각이 모두 다르다 / 동시인지 묻는다", to: rel-lorentz }
    - { label: "다른 좌표계에서 본 물체의 속도", to: rel-velocity }
    - { label: "빛의 진동수, 파장 변화", to: rel-doppler }
    - { label: "운동량, 에너지, 질량", to: rel-energy }

- id: rel-time
  title: 두 사건을 한 자리에서 본 사람을 찾는다
  body: |
    1. 두 사건을 정한다 (예: 출발과 도착, 빛의 방출과 흡수).
    2. 두 사건이 같은 자리에서 일어났다고 보는 사람이 고유 시간 $\Delta t_0$를 잰다.
    3. 다른 사람이 잰 시간은 $\gamma$배 길다.

    $$
    \Delta t = \gamma\,\Delta t_0
    $$

    답이 고유 시간보다 짧게 나오면 곱할 것을 나눈 것이다. $0.6c$면 $\gamma = 1.25$, $0.8c$면 $\gamma = \frac{5}{3}$.
  cards: [phys-rel-time-dilation, phys-rel-postulates]
  lessons: [mod-time-length]

- id: rel-length
  title: 그 길이와 함께 정지한 사람을 찾는다
  body: |
    1. 재려는 길이의 양 끝이 누구에 대해 정지해 있는지 본다. 그 사람이 고유 길이 $L_0$를 잰다.
    2. 그 길이에 대해 움직이는 사람은 운동 방향으로 $\gamma$로 나눈 길이를 본다.

    $$
    L = \frac{L_0}{\gamma}
    $$

    한 문제에서 고유 시간을 재는 사람과 고유 길이를 재는 사람은 보통 서로 다르다. 속력은 둘에게 같으므로 $v = L_0/\Delta t = L/\Delta t_0$로 검산한다.
  cards: [phys-rel-length-contraction, phys-rel-time-dilation]
  lessons: [mod-time-length]

- id: rel-lorentz
  title: 로런츠 변환에 간격을 넣는다
  body: |
    어느 쪽이 움직이는 좌표계($S'$)인지 정하고, 아는 간격을 넣는다.

    $$
    \Delta x = \gamma\,(\Delta x' + v\,\Delta t')
    $$

    $$
    \Delta t = \gamma\left(\Delta t' + \frac{v\,\Delta x'}{c^2}\right)
    $$

    - $S'$에서 동시($\Delta t' = 0$)인데 위치가 다르면 $S$에서는 동시가 아니다.
    - 움직이는 관찰자는 자기가 다가가는 쪽의 사건이 먼저 일어났다고 본다.
    - 같은 자리, 같은 순간의 두 사건은 누구에게나 동시다.
  cards: [phys-rel-lorentz-transform, phys-rel-simultaneity]
  lessons: [mod-lorentz, mod-light-speed]

- id: rel-velocity
  title: 속도 덧셈 공식
  body: |
    $v$는 좌표계의 속도, $u'$은 그 좌표계에서 본 물체의 속도, $u$는 정지 좌표계에서 본 속도. 방향은 부호로 넣는다.

    $$
    u = \frac{u' + v}{1 + \dfrac{u'v}{c^2}}
    $$

    $$
    u' = \frac{u - v}{1 - \dfrac{uv}{c^2}}
    $$

    분모의 부호는 분자의 부호와 같다. 결과가 $c$를 넘으면 잘못 넣은 것이다.
  cards: [phys-rel-velocity-addition]
  lessons: [mod-lorentz]

- id: rel-doppler
  title: 빛의 도플러 효과
  body: |
    광원과 관찰자의 상대 속도만 본다 (누가 움직이는지 구별하지 않는다).

    $$
    f = f_0\sqrt{\frac{1 - \beta}{1 + \beta}}
    $$

    $$
    \lambda = \lambda_0\sqrt{\frac{1 + \beta}{1 - \beta}}
    $$

    멀어지면 $\beta > 0$. 멀어지면 파장이 길어지는지(적색 편이)로 검산한다.
  cards: [phys-rel-doppler-light]
  lessons: [mod-lorentz]

- id: rel-energy
  title: 직각삼각형을 그린다
  body: |
    밑변 $mc^2$, 높이 $pc$, 빗변 $E$.

    $$
    E = \gamma mc^2, \qquad K = (\gamma - 1)\,mc^2
    $$

    $$
    E^2 = (pc)^2 + (mc^2)^2
    $$

    $$
    p = \gamma mv
    $$

    - 운동 에너지가 주어지면: $E = mc^2 + K$부터 구하고 삼각형으로 $pc$.
    - 속력이 주어지면: $\gamma$부터.
    - 반응에서 나온 에너지: 줄어든 질량 × $c^2$.
    - 빠른 입자에 $\frac{1}{2}mv^2$를 쓰지 않는다.
  cards: [phys-rel-energy, phys-rel-momentum-force]
  lessons: [mod-energy]

# ------------------------------------------------------------ 광자
- id: photon
  title: 어떤 실험인가?
  options:
    - { label: "금속에 빛을 쪼여 전자가 나온다 (광전 효과)", to: photon-pe }
    - { label: "X선이 전자에 맞고 꺾인다 (콤프턴 산란)", to: photon-compton }
    - { label: "광자의 에너지·운동량, 초당 광자 수", to: photon-basic }
    - { label: "뜨거운 물체의 복사 (흑체)", to: photon-bb }

- id: photon-pe
  title: 광자 에너지에서 통행료를 뺀다
  body: |
    $$
    hf = K_{\text{max}} + \Phi, \qquad K_{\text{max}} = eV_s
    $$

    - 세기를 키우면: 전자의 수(전류)만 늘어난다. 정지 전압은 그대로.
    - 진동수를 키우면: $K_{\text{max}}$와 정지 전압이 커진다.
    - 문턱 진동수 $f_0 = \Phi/h$ 아래에서는 전자가 안 나온다.
    - 그래프: 기울기 $h$, 가로축 절편 $f_0$, 세로축 절편 $-\Phi$.
    - 파장이 주어지면 $hc \approx 1240\,\text{eV}\cdot\text{nm}$.
  cards: [phys-qm-photoelectric, phys-qm-photon]
  lessons: [mod-photon]

- id: photon-compton
  title: 콤프턴 산란
  body: |
    $$
    \Delta\lambda = \frac{h}{mc}\,(1 - \cos\phi)
    $$

    - $\phi$는 광자가 꺾인 각. $90^\circ$면 $h/mc$, $180^\circ$면 $2h/mc$.
    - 전자가 얻은 에너지 = 광자가 잃은 에너지 $= \dfrac{hc}{\lambda} - \dfrac{hc}{\lambda'}$.
    - 파장은 늘어나기만 한다.
  cards: [phys-qm-compton, phys-qm-photon]
  lessons: [mod-photon]

- id: photon-basic
  title: 광자 하나의 에너지와 운동량
  body: |
    $$
    E = hf = \frac{hc}{\lambda}, \qquad p = \frac{h}{\lambda} = \frac{E}{c}
    $$

    초당 광자 수는 (일률) ÷ (광자 하나의 에너지).

    $$
    \frac{N}{t} = \frac{P\lambda}{hc}
    $$
  cards: [phys-qm-photon]
  lessons: [mod-photon]

- id: photon-bb
  title: 흑체 복사
  body: |
    $$
    P = \sigma\varepsilon AT^4
    $$

    $$
    \lambda_{\text{max}}T \approx 2.9 \times 10^{-3}\,\text{m}\cdot\text{K}
    $$

    온도가 2배면 복사 일률은 16배, 봉우리 파장은 절반. 온도는 켈빈으로 넣는다.
  cards: [phys-qm-blackbody]
  lessons: [mod-photon]

# ------------------------------------------------------------ 물질파와 우물
- id: wave
  title: 전자가 어떤 상황에 있는가?
  options:
    - { label: "그냥 날아가는 입자의 파장", to: wave-db }
    - { label: "무한 우물(상자)에 갇혀 있다", to: wave-inf }
    - { label: "유한한 벽, 장벽을 만난다", to: wave-tunnel }
    - { label: "용수철 퍼텐셜 (조화진동자)", to: wave-sho }
    - { label: "확률을 구한다 / 위치·운동량의 불확정성", to: wave-prob }

- id: wave-db
  title: 드 브로이 파장
  body: |
    $$
    \lambda = \frac{h}{p} = \frac{h}{mv} = \frac{h}{\sqrt{2mK}}
    $$

    무엇이 같은지부터 본다. 같은 속력이면 가벼운 쪽이, 같은 운동 에너지여도 가벼운 쪽이 파장이 길다. 같은 운동량이면 파장이 같다.
  cards: [phys-qm-de-broglie]
  lessons: [mod-matter-wave]

- id: wave-inf
  title: 정상파 조건으로 바로 쓴다
  body: |
    $$
    E_n = \frac{h^2}{8mL^2}\,n^2, \qquad \psi_n = \sqrt{\frac{2}{L}}\sin\frac{n\pi x}{L}
    $$

    - 에너지는 $n^2$에 비례, $1/L^2$에 비례.
    - 전이하는 빛: $hf = E_{\text{high}} - E_{\text{low}}$.
    - 확률 밀도의 봉우리는 $n$개.
    - 2차원·3차원: 축마다 따로 구해 에너지는 더하고 확률은 곱한다.
  cards: [phys-qm-infinite-well, phys-qm-well-2d-3d]
  lessons: [mod-wells]

- id: wave-tunnel
  title: 벽 속에서는 지수적으로 줄어든다
  body: |
    $$
    \beta = \frac{\sqrt{2m(U_0 - E)}}{\hbar}, \qquad T \approx e^{-2\beta a}
    $$

    - 유한 우물: 벽 속으로 $1/\beta$쯤 스며든다. 같은 $n$의 에너지가 무한 우물보다 낮고, 갇힌 상태의 수가 유한하다.
    - 터널링: 폭, 질량, 에너지 부족분이 클수록 확률이 지수적으로 줄어든다.
    - 지나간 뒤에도 에너지와 파장은 그대로, 진폭만 줄어든다.
    - 우물에서 꺼내려면 $U_0 - E$ 이상의 에너지를 가진 광자가 필요하다.
  cards: [phys-qm-tunneling, phys-qm-finite-well]
  lessons: [mod-wells]

- id: wave-sho
  title: 간격이 일정한 사다리
  body: |
    $$
    E_n = \left(n + \frac{1}{2}\right)\hbar\omega, \qquad \omega = \sqrt{\frac{k'}{m}}
    $$

    $n$은 0부터. 바닥 상태가 $\frac{1}{2}\hbar\omega$, 이웃한 준위의 차이는 언제나 $\hbar\omega$.
  cards: [phys-qm-harmonic-oscillator]
  lessons: [mod-wells]

- id: wave-prob
  title: 확률 밀도와 불확정성
  body: |
    $$
    P = \int_{x_1}^{x_2}\lvert\psi\rvert^2\,dx, \qquad \int_{-\infty}^{\infty}\lvert\psi\rvert^2\,dx = 1
    $$

    $$
    \Delta x\,\Delta p_x \ge \hbar
    $$

    - 상수 $A$는 전체 확률 = 1에서 구한다.
    - 대칭인 구간은 적분하지 않고 비율로 읽는다.
    - 좁게 가둘수록 운동량이 퍼지고 최소 에너지가 커진다.
  cards: [phys-qm-wave-function, phys-qm-uncertainty, phys-qm-schrodinger]
  lessons: [mod-matter-wave]

# ------------------------------------------------------------ 원자
- id: atom
  title: 무엇을 구하라고 하는가?
  options:
    - { label: "수소(또는 전자 하나인 이온)의 에너지, 반지름, 빛의 파장", to: atom-h }
    - { label: "가능한 양자수, 상태의 수", to: atom-qn }
    - { label: "각운동량, 자기 모멘트", to: atom-ang }
    - { label: "전자가 발견될 거리, 확률", to: atom-radial }

- id: atom-h
  title: 준위의 차이가 광자다
  body: |
    $$
    E_n = -13.6\,\frac{Z^2}{n^2}\,\text{eV}, \qquad r_n = \frac{a_0n^2}{Z}
    $$

    $$
    \frac{1}{\lambda} = R\left(\frac{1}{n_{\text{low}}^2} - \frac{1}{n_{\text{high}}^2}\right)
    $$

    - 수소는 $Z = 1$. 준위: $-13.6$, $-3.4$, $-1.51$, $-0.85\,\text{eV}$.
    - 도착 준위가 1이면 라이먼(자외선), 2면 발머(가시광선), 3이면 파셴(적외선).
    - 가장 긴 파장: 바로 위 준위에서. 가장 짧은 파장: $n = \infty$에서.
    - 이온화 에너지: $0 - E_n$.
  cards: [phys-atom-hydrogen-energy, phys-atom-bohr-model, phys-atom-hydrogen-like]
  lessons: [mod-hydrogen]

- id: atom-qn
  title: 범위를 차례로 적는다
  body: |
    - $l = 0, 1, \dots, n - 1$
    - $m_l = -l, \dots, l$ ($2l + 1$개)
    - $m_s = \pm\frac{1}{2}$

    부껍질의 상태 수는 $2(2l + 1)$, 껍질의 상태 수는 $2n^2$. 한 상태에 전자 하나 (파울리 배타 원리).

    전이의 선택 규칙: $\Delta l = \pm 1$, $\Delta m_l = 0, \pm 1$.
  cards: [phys-atom-quantum-numbers, phys-atom-multi-electron, phys-atom-selection-rules]
  lessons: [mod-quantum-numbers]

- id: atom-ang
  title: 크기는 근호, z성분은 정수배
  body: |
    $$
    L = \sqrt{l(l + 1)}\,\hbar, \qquad L_z = m_l\hbar
    $$

    $$
    \mu_{\text{orb},z} = -m_l\,\mu_B, \qquad U = m_l\,\mu_BB
    $$

    스핀: $S = \frac{\sqrt{3}}{2}\hbar$, $S_z = \pm\frac{1}{2}\hbar$, $\mu_{s,z} = \mp\mu_B$.

    크기가 주어지면 $l(l + 1)$을 맞춰 $l$부터 찾는다.
  cards: [phys-atom-orbital-angular-momentum, phys-atom-orbital-magnetic-moment, phys-atom-spin, phys-atom-total-angular-momentum]
  lessons: [mod-quantum-numbers]

- id: atom-radial
  title: 방사 확률 밀도
  body: |
    $$
    \rho(r) = 4\pi r^2\lvert\psi\rvert^2, \qquad P = \int_{r_1}^{r_2}\rho(r)\,dr
    $$

    - 가장 가능성이 높은 거리: $d\rho/dr = 0$. 수소 바닥 상태는 $r = a_0$.
    - 평균 거리: $\int r\rho\,dr$. 수소 바닥 상태는 $\frac{3}{2}a_0$.
    - 문제에서 준 식이 밀도인지 확률인지 확인한다.
  cards: [phys-atom-radial-probability]
  lessons: [mod-quantum-numbers]

# ------------------------------------------------------------ 고체
- id: solid
  title: 띠 구조로 읽는다
  body: |
    - 가장 높은 띠가 덜 참 → 금속. 꽉 차고 $E_g$ 작음 → 반도체. 꽉 차고 $E_g$ 큼 → 절연체.
    - 차 있을 확률: 페르미 준위에서 항상 $\frac{1}{2}$.

    $$
    P(E) = \frac{1}{e^{(E - E_F)/kT} + 1}
    $$

    - 15족을 섞으면 n형(전자), 13족을 섞으면 p형(정공).
    - 다이오드: p형에 $+$가 순방향.

    $$
    I = I_0\left(e^{eV/kT} - 1\right)
    $$
  cards: [phys-atom-energy-bands, phys-atom-fermi-dirac, phys-atom-semiconductor]
  lessons: [mod-solids]

# ------------------------------------------------------------ 핵
- id: nuc
  title: 무엇을 구하라고 하는가?
  options:
    - { label: "남은 양, 반감기, 붕괴율", to: nuc-decay }
    - { label: "반응식의 빈칸, 붕괴의 종류", to: nuc-eq }
    - { label: "나오는 에너지, 결합 에너지", to: nuc-energy }

- id: nuc-decay
  title: 반감기가 몇 번 지났는지 센다
  body: |
    $$
    N = N_0e^{-\lambda t} = N_0\left(\frac{1}{2}\right)^{t/T_{1/2}}
    $$

    $$
    R = \lambda N, \qquad T_{1/2} = \frac{\ln 2}{\lambda}
    $$

    - 붕괴율도 같은 반감기로 줄어든다.
    - 질량이 주어지면 핵의 수는 (질량 ÷ 몰질량) × 아보가드로 수.
    - 반감기를 초로 바꿔야 붕괴율이 $\text{Bq}$로 나온다.
    - 남은 양을 묻는지 붕괴한 양을 묻는지 확인한다.
  cards: [phys-nuc-decay-law]
  lessons: [mod-nucleus]

- id: nuc-eq
  title: 위 숫자의 합, 아래 숫자의 합을 맞춘다
  body: |
    - 알파 붕괴: 원자 번호 $-2$, 질량수 $-4$.
    - 베타 마이너스 붕괴: 원자 번호 $+1$, 질량수 그대로 (전자와 반중성미자).
    - 베타 플러스 붕괴: 원자 번호 $-1$, 질량수 그대로 (양전자와 중성미자).
    - 중성자는 질량수 1, 전하 0.
  cards: [phys-nuc-alpha-decay, phys-nuc-beta-decay, phys-nuc-fission-fusion, phys-nuc-particles]
  lessons: [mod-nucleus]

- id: nuc-energy
  title: 줄어든 질량에 c²을 곱한다
  body: |
    $$
    Q = \left(\sum M_{\text{before}} - \sum M_{\text{after}}\right)c^2
    $$

    - $1\,\text{u}$는 약 $931.5\,\text{MeV}$. 문제에서 $c^2$을 $\text{MeV/u}$로 주면 그 값을 쓴다.
    - $Q > 0$이면 저절로 일어난다.
    - 결합 에너지: (낱개 핵자의 질량 합 − 핵의 질량) × $c^2$.
  cards: [phys-nuc-binding-energy, phys-nuc-alpha-decay, phys-nuc-fission-fusion, phys-rel-energy]
  lessons: [mod-nucleus, mod-energy]
